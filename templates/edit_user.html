<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل المستخدم - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 0;
        }
        .edit-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="edit-card">
            <h3 class="mb-4"><i class="fas fa-user-edit text-primary"></i> تعديل المستخدم</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">User ID</label>
                    <input type="text" class="form-control" value="{{ user.user_id }}" disabled>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" class="form-control" value="{{ user.first_name }} {{ user.last_name or '' }}" disabled>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">نوع الاشتراك</label>
                    <select class="form-select" name="subscription_type" required>
                        <option value="free" {% if user.subscription_type == 'free' %}selected{% endif %}>Free</option>
                        <option value="weekly" {% if user.subscription_type == 'weekly' %}selected{% endif %}>Weekly</option>
                        <option value="monthly" {% if user.subscription_type == 'monthly' %}selected{% endif %}>Monthly</option>
                        <option value="yearly" {% if user.subscription_type == 'yearly' %}selected{% endif %}>Yearly</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">مدة الاشتراك (بالأيام)</label>
                    <input type="number" class="form-control" name="days" value="30" required>
                    <small class="text-muted">سيتم إضافة هذه المدة من اليوم</small>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> حفظ التغييرات
                    </button>
                    <a href="/users" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> رجوع
                    </a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
